name: Block DO NOT MERGE
on: [pull_request, pull_request_target]
jobs:
  block:
    runs-on: ubuntu-latest
    steps:
      - name: Fail if blocking label is present
        run: |
          labels="${{ toJson(github.event.pull_request.labels) }}"
          echo "$labels" | grep -E '"name": "(⛔️ DO NOT MERGE|🚫 DO NOT MERGE|🚧 WIP)"' && {
            echo "PR has a blocking label."; exit 1;
          } || echo "No blocking label found."