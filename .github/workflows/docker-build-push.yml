name: Build & Push Docker Image (staging)

on:
  push:
    branches: [ "staging" ]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }} # owner/repo
  # Build-time envs for CRA; adjust/add as needed:
  REACT_APP_ENV: staging

jobs:
  docker:
    name: Build & Push
    runs-on: ubuntu-latest
    concurrency:
      group: docker-${{ github.ref }}
      cancel-in-progress: true

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Derive image ID and tags
        id: meta
        run: |
          REPO_LC=$(echo "${{ env.IMAGE_NAME }}" | tr '[:upper:]' '[:lower:]')
          IMAGE_ID="${{ env.REGISTRY }}/${REPO_LC}"
          echo "image=${IMAGE_ID}" >> "$GITHUB_OUTPUT"

          SHA_TAG="${{ github.sha }}"
          # Tags: staging, short-sha, latest (optional)
          echo "tags=${IMAGE_ID}:staging,${IMAGE_ID}:${SHA_TAG:0:7},${IMAGE_ID}:latest" >> "$GITHUB_OUTPUT"

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          file: ./Dockerfile
          tags: ${{ steps.meta.outputs.tags }}
          build-args: |
            REACT_APP_ENV=${{ env.REACT_APP_ENV }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: linux/amd64

      - name: Print image info
        run: |
          echo "Pushed: ${{ steps.meta.outputs.tags }}"
          echo "Pull with:"
          echo "  docker pull ${{ steps.meta.outputs.image }}:staging"
